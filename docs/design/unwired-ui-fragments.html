<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Frayd unwired UI fragments</title>
<!--
  Design fragments for controls that Frayd does not implement. Nothing serves or loads
  this page, and client/index.html ships none of these controls. The comment above each
  fragment says where it belonged and what must exist before it can move into the live
  UI. The contracts are in docs/development.md under "Unwired UI design fragments".
-->
<link rel="stylesheet" href="../../client/css/frayd.css">
<style>
  /* Styles used only by these fragments. */
  .btn-ghost {
    display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 22px;
    border-radius: 10px; background: rgba(20,20,26,.6); border: 1px solid rgba(255,255,255,.25);
    color: #fff; font-weight: 600;
  }
  .pb-btn { background: none; border: none; color: var(--fg-muted); display: flex; }
  .pb-btn:hover { color: var(--fg); }
</style>
</head>
<body>

<!-- Sign-in form, above the submit button. Needs an explicit session/storage lifetime policy. -->
<template id="unwired-remember">
  <div class="row-between">
    <label style="display:flex;align-items:center;gap:8px">
      <input type="checkbox" disabled style="accent-color:#5B46F6"> Remember me
    </label>
  </div>
</template>

<!-- Sign-in form, below the submit button. Needs OAuth/SSO routes and safe account linking. -->
<template id="unwired-social-auth">
  <div class="divider">or continue with</div>

  <div class="social-row">
    <button type="button" class="btn-social" disabled>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M21.35 11.1h-9.17v2.73h6.51c-.33 3.81-3.5 5.44-6.5 5.44C8.36 19.27 5 16.25 5 12c0-4.1 3.2-7.27 7.2-7.27 3.09 0 4.9 1.97 4.9 1.97L19 4.72S16.56 2 12.1 2C6.42 2 2.03 6.8 2.03 12c0 5.05 4.13 10 10.22 10 5.35 0 9.25-3.67 9.25-9.09 0-1.15-.15-1.81-.15-1.81Z"/></svg>
      Google
    </button>
    <button type="button" class="btn-social" disabled>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm6.6 7.6-5.7 7.4c-.4.5-1.1.5-1.5.1l-3.9-3.9a.9.9 0 1 1 1.3-1.3l3.1 3.1 5-6.5a.9.9 0 0 1 1.7.5v.6Z"/></svg>
      SSO
    </button>
  </div>
</template>

<!-- Top bar, after the party button. Needs a notification source and read/dismiss state. -->
<template id="unwired-notifications">
  <button type="button" disabled aria-label="Notifications">
    <svg class="icon" viewBox="0 0 24 24" width="20" height="20"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>
  </button>
</template>

<!-- Hero call-to-action row, beside Play. Needs a media details surface. -->
<template id="unwired-hero-info">
  <button type="button" class="btn-ghost" disabled>More info</button>
</template>

<!-- Audio player bar, around the play button. Needs queue order, resume and party authority semantics. -->
<template id="unwired-audio-navigation">
  <button type="button" class="pb-btn" disabled aria-label="Previous">
    <svg class="icon" viewBox="0 0 24 24"><path d="M18 5v14L8 12ZM6 5v14"/></svg></button>
  <button type="button" class="pb-btn" disabled aria-label="Next">
    <svg class="icon" viewBox="0 0 24 24"><path d="M6 5v14l10-7ZM18 5v14"/></svg></button>
</template>

</body>
</html>

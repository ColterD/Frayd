name: Isolated native diagnostics and Windows lookup proof
on:
  push:
    branches: [qa/e0-native-windows-probes-20261031]
permissions:
  contents: read
jobs:
  native-focus:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            architecture: x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '2'
      FRAYD_NATIVE_EXPECT_ARCH: ${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build actual architecture helper from recorded source
        shell: bash
        run: |
          git rev-parse HEAD
          test "$(uname -m)" = "$FRAYD_NATIVE_EXPECT_ARCH"
          test "$(sysctl -n sysctl.proc_translated 2>/dev/null || true)" != 1
          python3 --version
          rustup toolchain install 1.99.1 --profile minimal
          rustc +1.99.1 --version --verbose
          cargo +1.99.1 build --locked --release --manifest-path server/Cargo.toml --bin frayd-native --target '${{ matrix.target }}'
          printf 'FRAYD_NATIVE_HELPER=%s/server/target/%s/release/frayd-native\n' "$GITHUB_WORKSPACE" '${{ matrix.target }}' >> "$GITHUB_ENV"
      - name: Repeat owned descendant cleanup with failure diagnostics
        shell: bash
        run: |
          PYTHONPATH=tests python3 - <<'PY'
          import unittest
          name = 'test_native_bundle.NativeOwnership.test_owned_server_group_stops_descendants_and_preserves_foreign_group'
          suite = unittest.TestSuite(unittest.defaultTestLoader.loadTestsFromName(name) for _ in range(8))
          assert suite.countTestCases() == 8
          result = unittest.TextTestRunner(verbosity=2, failfast=True).run(suite)
          raise SystemExit(0 if result.wasSuccessful() and not result.skipped else 1)
          PY
  windows-lookup:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Record actual Windows engines
        shell: pwsh
        run: |
          git rev-parse HEAD
          python --version
          $PSVersionTable
          powershell.exe -NoProfile -NonInteractive -Command '$PSVersionTable'
      - name: Compare exact baseline and current lookup status and wrapper semantics
        shell: pwsh
        run: python tests/qa-e0-windows-probe.py . tests/qa-e0-baseline.ps1

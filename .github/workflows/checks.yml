name: Isolated Windows installer job qualification
on:
  push:
    branches: [qa/windows-job-20261030]
permissions:
  contents: read
jobs:
  windows-bootstrap:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      FRAYD_WINDOWS_REQUIRE_QUALIFICATION: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record Windows qualification environment
        shell: pwsh
        run: |
          git rev-parse HEAD
          python --version
          $PSVersionTable
          powershell.exe -NoProfile -NonInteractive -Command '$PSVersionTable'
          Write-Output "Runner image: $env:ImageOS / $env:ImageVersion"
      - name: Qualify owned-tree deadline and generated-entry failures
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath tests/test_bootstrap_windows.py -PathType Leaf)) {
            throw 'Required Windows qualification suite is missing'
          }
          @'
          import sys, unittest
          sys.path.insert(0, 'tests')
          from test_bootstrap_windows import PowerShellCore, WindowsPowerShell51, QualificationPolicy
          methods = [
              'test_generated_entry_deadline_terminates_the_owned_powershell_tree',
              'test_generated_entry_cleans_its_file_after_success_and_child_failure',
              'test_job_output_preserves_explicit_utf8_bytes',
              'test_generated_download_failure_never_executes_existing_temp_script',
          ]
          suite = unittest.TestSuite()
          for engine in (PowerShellCore, WindowsPowerShell51):
              for method in methods:
                  suite.addTest(engine(method))
          suite.addTest(WindowsPowerShell51('test_generated_file_entry_overrides_only_process_restricted_policy'))
          suite.addTests(unittest.defaultTestLoader.loadTestsFromTestCase(QualificationPolicy))
          if suite.countTestCases() != 14:
              raise SystemExit('Focused Windows qualification must contain 14 tests')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped:
              raise SystemExit(1)
          '@ | python

  windows-full-suite:
    needs: windows-bootstrap
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      FRAYD_WINDOWS_REQUIRE_QUALIFICATION: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record Windows qualification environment
        shell: pwsh
        run: |
          git rev-parse HEAD
          python --version
          $PSVersionTable
          powershell.exe -NoProfile -NonInteractive -Command '$PSVersionTable'
          Write-Output "Runner image: $env:ImageOS / $env:ImageVersion"
      - name: Execute installer and startup regressions without installing software
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath tests/test_bootstrap_windows.py -PathType Leaf)) {
            throw 'Required Windows qualification suite is missing'
          }
          @'
          import unittest
          suite = unittest.defaultTestLoader.discover('tests', pattern='test_bootstrap_windows.py')
          if suite.countTestCases() == 0:
              raise SystemExit('No Windows bootstrap tests were discovered')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped:
              raise SystemExit(1)
          '@ | python

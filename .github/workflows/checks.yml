name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-and-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 22.23.4
        shell: bash
        run: |
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "x86_64"
          FRAYD_NODE_BIN_DIRECTORY="$RUNNER_TOOL_CACHE/node/22.23.4/x64/bin"
          if ! test -x "$FRAYD_NODE_BIN_DIRECTORY/node" || test "$("$FRAYD_NODE_BIN_DIRECTORY/node" --version)" != "v22.23.4"; then
            FRAYD_NODE_TEMP_DIRECTORY="$(mktemp -d "$RUNNER_TEMP/frayd-node-22.23.4.XXXXXXXX")"
            FRAYD_NODE_ARCHIVE="$FRAYD_NODE_TEMP_DIRECTORY/node-v22.23.4-linux-x64.tar.xz"
            trap 'rm -f -- "$FRAYD_NODE_ARCHIVE"' EXIT
            curl --fail --silent --show-error --location --retry 2 --max-time 120 \
              --output "$FRAYD_NODE_ARCHIVE" https://nodejs.org/dist/v22.23.4/node-v22.23.4-linux-x64.tar.xz
            # Official v22.23.4 SHASUMS256.txt; verify before extracting or executing.
            printf '%s  %s\n' 1805bcd35e6815559bd2eb97db438d3fdb0eb3a5e6a977b7c1badca76337e9ce "$FRAYD_NODE_ARCHIVE" | sha256sum --check --status
            tar -xJf "$FRAYD_NODE_ARCHIVE" -C "$FRAYD_NODE_TEMP_DIRECTORY"
            FRAYD_NODE_BIN_DIRECTORY="$FRAYD_NODE_TEMP_DIRECTORY/node-v22.23.4-linux-x64/bin"
          fi
          test "$("$FRAYD_NODE_BIN_DIRECTORY/node" --version)" = "v22.23.4"
          printf '%s\n' "$FRAYD_NODE_BIN_DIRECTORY" >> "$GITHUB_PATH"
      - name: Client tests
        run: |
          node --check client/js/app.js
          node --check client/js/party.js
          bash -n tests/fixtures/generate-native-resume.sh
          node --test tests/*.test.cjs
      - name: Real browser DOM regressions
        run: node tests/browser-regression.cjs
      - name: Python lint (locked Ruff)
        run: |
          python3 -m venv "$RUNNER_TEMP/frayd-python-lint"
          "$RUNNER_TEMP/frayd-python-lint/bin/python" -m pip install --disable-pip-version-check --require-hashes --no-deps --only-binary=:all: -r .github/requirements-ci.txt
          "$RUNNER_TEMP/frayd-python-lint/bin/ruff" check --no-cache --select E4,E7,E9,F,B905 scripts tests
      - name: Compose validation
        run: docker compose config --quiet
      - name: Locked Rust tests, Clippy, release build and runtime images
        run: |
          docker build -t frayd-qa:local .
          docker build -f Dockerfile.proxy -t frayd-proxy-qa:local .
      - name: Disposable HTTP and persistence integration
        run: |
          python3 scripts/check-build-context.py
          python3 scripts/integration.py
          python3 tests/test_dns_recovery.py
  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Query OSV for locked crates (fails on applicable advisories)
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/audit-dependencies.py

name: Isolated Windows installer job qualification
on:
  push:
    branches: [qa/windows-job-20261030]
permissions:
  contents: read
jobs:
  windows-bootstrap:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      FRAYD_WINDOWS_REQUIRE_QUALIFICATION: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record Windows qualification environment
        shell: pwsh
        run: |
          git rev-parse HEAD
          python --version
          $PSVersionTable
          powershell.exe -NoProfile -NonInteractive -Command '$PSVersionTable'
          Write-Output "Runner image: $env:ImageOS / $env:ImageVersion"
      - name: Diagnose parent and nested-file startup under original deadline
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath tests/test_bootstrap_windows.py -PathType Leaf)) {
            throw 'Required Windows qualification suite is missing'
          }
          python tests/diagnose_windows_entry.py --tests-dir tests --profile-control

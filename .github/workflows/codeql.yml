name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Source and runner tool provenance
        run: |
          git rev-parse HEAD
          sha256sum server/Cargo.lock
          node --version
          python3 --version
      - name: Explain absent Python source
        if: matrix.language == 'python' && hashFiles('**/*.py') == ''
        run: echo "Python analysis skipped because this revision contains no Python source."
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        id: init
        if: matrix.language != 'python' || hashFiles('**/*.py') != ''
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - name: CodeQL tool provenance
        if: matrix.language != 'python' || hashFiles('**/*.py') != ''
        env:
          CODEQL_VERSION: ${{ steps.init.outputs.codeql-version }}
        run: test -n "$CODEQL_VERSION" && printf '%s\n' "$CODEQL_VERSION"
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: matrix.language != 'python' || hashFiles('**/*.py') != ''
        with:
          category: /language:${{ matrix.language }}

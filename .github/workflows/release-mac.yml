# Functional nonpublishing qualification is prepared on fork PR2, pending acceptance:
# https://github.com/ColterD/Frayd/blob/fix/coderabbit-all-findings/.github/workflows/release-mac.yml
# Replace this placeholder when the accepted draft PR2 is merged.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification-held:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    steps:
      - name: Qualification remains held on main
        run: ':'

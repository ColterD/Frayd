name: Native macOS qualification (no publication)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            architecture: x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      FRAYD_NATIVE_REQUIRE_QUALIFICATION: '1'
      CARGO_BUILD_JOBS: '2'
      FRAYD_NATIVE_EXPECT_ARCH: ${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify actual native architecture (reject Rosetta)
        shell: bash
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = "$FRAYD_NATIVE_EXPECT_ARCH"
          test "$(sysctl -n sysctl.proc_translated 2>/dev/null || true)" != 1
          if test "$FRAYD_NATIVE_EXPECT_ARCH" = x86_64; then
            test "$(sysctl -n hw.optional.arm64 2>/dev/null || true)" != 1
          else
            test "$(sysctl -n hw.optional.arm64)" = 1
          fi
          printf 'CARGO_TARGET_DIR=%s/frayd-native-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          uname -sm
          printf 'Runner image: %s / %s\n' "$ImageOS" "$ImageVersion"

      - name: Exact Rust toolchain and isolated source
        shell: bash
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component clippy
          rustc +1.99.1 --version --verbose
          # Build a disposable source copy; remove it before runtime qualification.
          mkdir "$RUNNER_TEMP/frayd-build-source"
          cp -R server "$RUNNER_TEMP/frayd-build-source/server"
          printf 'FRAYD_NATIVE_HELPER=%s/%s/release/frayd-native\n' "$CARGO_TARGET_DIR" '${{ matrix.target }}' >> "$GITHUB_ENV"

      - name: Locked native diagnostics and both binaries
        shell: bash
        run: |
          cargo +1.99.1 test --locked --manifest-path "$RUNNER_TEMP/frayd-build-source/server/Cargo.toml" --bin frayd-native --target '${{ matrix.target }}'
          cargo +1.99.1 clippy --locked --manifest-path "$RUNNER_TEMP/frayd-build-source/server/Cargo.toml" --bin frayd-native --target '${{ matrix.target }}' -- -D warnings
          cargo +1.99.1 build --locked --release --manifest-path "$RUNNER_TEMP/frayd-build-source/server/Cargo.toml" --bin frayd-server --bin frayd-native --target '${{ matrix.target }}'

      - name: Package complete per-architecture archive
        shell: bash
        run: |
          bash -n scripts/native/package.sh scripts/native/install.sh scripts/native/start.sh scripts/uninstall.sh
          scripts/native/package.sh "$RUNNER_TEMP/frayd-packages" '${{ matrix.target }}' "$CARGO_TARGET_DIR/${{ matrix.target }}/release/frayd-server" "$FRAYD_NATIVE_HELPER"
          # Only the copied compile-time source is removed; active checkout stays intact.
          python3 -c 'import os, pathlib, shutil; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"frayd-build-source"; assert p.parent == pathlib.Path(os.environ["RUNNER_TEMP"]) and not p.is_symlink(); shutil.rmtree(p)'
          printf 'FRAYD_NATIVE_ARCHIVE=%s\n' "$RUNNER_TEMP"/frayd-packages/*.tar.gz >> "$GITHUB_ENV"
          printf 'FRAYD_NATIVE_BUILD_SOURCE=%s\n' "$RUNNER_TEMP/frayd-build-source/server" >> "$GITHUB_ENV"

      - name: Actual helper and server lifecycle, HTTP reader and persistence
        shell: bash
        run: |
          python3 -m unittest discover -s tests -p test_native_bundle.py -v

      - name: Nonsecret package provenance in retained job logs
        if: success()
        shell: bash
        run: |
          python3 -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"frayd-packages"; print(next(p.glob("*.tar.gz.sha256")).read_text()); print(next(p.glob("*/manifest.json")).read_text())'
          printf '%s\n' 'Actual native basic lifecycle passed. Media codecs, signing, binary retention and publication remain unqualified/held.' >> "$GITHUB_STEP_SUMMARY"
          # No upload/download/release action: pinned upload v7.0.2 failed the
          # coordinator production-dependency advisory gate on 2026-10-28.

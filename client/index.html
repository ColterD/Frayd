<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frayd</title>
<link rel="stylesheet" href="vendor/plyr/plyr.min.css">
<link rel="stylesheet" href="css/frayd.css">
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login" style="display:none">
  <div class="auth-brand">
    <h1>FRAYD</h1>
    <p>Your media, everywhere on your network</p>
  </div>

  <form class="auth-card" id="login-form" autocomplete="on">
    <h2>Sign in</h2>
    <div class="auth-error" id="auth-error"></div>

    <div class="field">
      <label for="email">Email</label>
      <div class="input-wrap">
        <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        <input id="email" type="email" placeholder="you@example.com" required>
      </div>
    </div>

    <div class="field">
      <label for="password">Password <a href="#" onclick="return false">Forgot?</a></label>
      <div class="input-wrap">
        <svg class="icon" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        <input id="password" type="password" placeholder="••••••••" required>
        <button type="button" class="reveal" id="pw-toggle" aria-label="Show password">
          <svg class="icon" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <div class="row-between">
      <label style="display:flex;align-items:center;gap:8px">
        <input type="checkbox" id="remember" style="accent-color:#5B46F6"> Remember me
      </label>
    </div>

    <button type="submit" class="btn-primary">Sign in</button>

    <div class="divider">or continue with</div>

    <div class="social-row">
      <button type="button" class="btn-social" onclick="return false">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M21.35 11.1h-9.17v2.73h6.51c-.33 3.81-3.5 5.44-6.5 5.44C8.36 19.27 5 16.25 5 12c0-4.1 3.2-7.27 7.2-7.27 3.09 0 4.9 1.97 4.9 1.97L19 4.72S16.56 2 12.1 2C6.42 2 2.03 6.8 2.03 12c0 5.05 4.13 10 10.22 10 5.35 0 9.25-3.67 9.25-9.09 0-1.15-.15-1.81-.15-1.81Z"/></svg>
        Google
      </button>
      <button type="button" class="btn-social" onclick="return false">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm6.6 7.6-5.7 7.4c-.4.5-1.1.5-1.5.1l-3.9-3.9a.9.9 0 1 1 1.3-1.3l3.1 3.1 5-6.5a.9.9 0 0 1 1.7.5v.6Z"/></svg>
        SSO
      </button>
    </div>
  </form>

  <div class="auth-footer">
    On your home network? <a href="#" id="guest">Continue as guest</a>
  </div>
</div>

<!-- ============ APP SHELL ============ -->
<div id="app">
  <nav id="sidebar">
    <div class="brand">FRAYD</div>
    <button class="nav-item active" data-kind="all">
      <svg class="icon" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1Z"/></svg>
      Dashboard</button>
    <button class="nav-item" data-kind="movie">
      <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3Z"/></svg>
      Movies</button>
    <button class="nav-item" data-kind="music">
      <svg class="icon" viewBox="0 0 24 24"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg>
      Music</button>
    <button class="nav-item" data-kind="audiobook">
      <svg class="icon" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      Audiobooks</button>
    <div class="nav-section">Library</div>
    <button class="nav-item" data-kind="ebook">
      <svg class="icon" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5v13ZM4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>
      Ebooks</button>
    <button class="nav-item" data-kind="comic">
      <svg class="icon" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M4 15h16M10 3v18"/></svg>
      Comics</button>
  </nav>

  <header id="topbar">
    <div id="search">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="search" placeholder="Search your library…">
    </div>
    <button id="party-btn" aria-label="Party">
      <svg class="icon" viewBox="0 0 24 24" width="20" height="20"><path d="M4 20v-6a8 8 0 0 1 16 0v6"/><path d="M2 20h20"/><circle cx="12" cy="6" r="2"/><path d="m9 9-2 3M15 9l2 3"/></svg>
    </button>
    <button id="bell" aria-label="Notifications">
      <svg class="icon" viewBox="0 0 24 24" width="20" height="20"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>
    </button>
    <button id="add-media">
      <svg class="icon" viewBox="0 0 24 24" style="stroke:#fff"><path d="M12 5v14M5 12h14"/></svg>
      Add media</button>
  </header>

  <main id="main">
    <div id="hero"></div>
  </main>

  <!-- bottom persistent player (audio) -->
  <div id="playerbar">
    <div id="pb-thumb"></div>
    <div id="pb-meta">
      <div class="t" id="pb-title">—</div>
      <div class="s" id="pb-sub"></div>
    </div>
    <div class="pb-center">
      <div class="pb-controls">
        <button class="pb-btn" aria-label="Previous">
          <svg class="icon" viewBox="0 0 24 24"><path d="M18 5v14L8 12ZM6 5v14"/></svg></button>
        <button class="pb-play" id="pb-play">▶</button>
        <button class="pb-btn" aria-label="Next">
          <svg class="icon" viewBox="0 0 24 24"><path d="M6 5v14l10-7ZM18 5v14"/></svg></button>
      </div>
      <div class="pb-track">
        <span class="time" id="pb-cur">0:00</span>
        <div class="pb-bar" id="pb-bar"><div class="fill" id="pb-fill"></div></div>
        <span class="time" id="pb-dur">0:00</span>
      </div>
    </div>
    <div class="pb-right">
      <svg class="icon" viewBox="0 0 24 24" style="stroke:#8A8F9E"><path d="M11 5 6 9H2v6h4l5 4V5ZM15.5 8.5a5 5 0 0 1 0 7"/></svg>
      <div class="pb-vol" id="pb-vol"><div class="fill"></div></div>
      <button id="pb-close" aria-label="Close player">✕</button>
    </div>
  </div>

  <!-- video modal (Plyr) -->
  <div id="video-modal">
    <div class="modal-inner">
      <div class="modal-head">
        <span class="t" id="vm-title"></span>
        <button id="vm-close" aria-label="Close">✕</button>
      </div>
      <video id="plyr-video" playsinline controls></video>
    </div>
  </div>

  <!-- comic reader -->
  <div id="comic-modal">
    <div class="comic-head">
      <span class="t" id="cm-title"></span>
      <span id="cm-pageinfo"></span>
      <button id="cm-close" aria-label="Close">✕</button>
    </div>
    <img id="cm-img" alt="">
    <div class="comic-nav">
      <button id="cm-prev">‹ Prev</button>
      <button id="cm-next">Next ›</button>
    </div>
  </div>

  <!-- party panel -->
  <div id="party-modal">
    <div class="modal-inner party-inner">
      <div class="modal-head">
        <span class="t">Party</span>
        <button id="pt-close" aria-label="Close">✕</button>
      </div>
      <div id="party-stage"></div>
    </div>
  </div>

  <!-- ebook reader -->
  <div id="ebook-modal">
    <div class="comic-head">
      <span class="t" id="em-title"></span>
      <span id="em-pageinfo"></span>
      <button id="em-close" aria-label="Close">✕</button>
    </div>
    <iframe id="em-frame" sandbox="" title="Ebook"></iframe>
    <div class="comic-nav">
      <button id="em-prev">‹ Prev</button>
      <button id="em-next">Next ›</button>
    </div>
  </div>
</div>

<script src="vendor/plyr/plyr.min.js"></script>
<script src="js/app.js"></script>
<script src="js/party.js"></script>
</body>
</html>

name: frayd
services:
  app:
    init: true
    build:
      context: .
      # Unset variables are not passed, so the Dockerfile's `unknown` defaults apply.
      args:
        - FRAYD_BUILD_COMMIT
        - FRAYD_BUILD_COMMITS_SINCE_TAG
        - FRAYD_BUILD_DIRTY
    image: frayd:local
    restart: unless-stopped
    environment:
      # Only the bundled proxy reaches this service, and it overwrites X-Forwarded-For with the real peer address.
      FRAYD_TRUSTED_PROXY: "1"
    volumes:
      - data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    networks:
      - isolated
  proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    image: frayd-proxy:local
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRAYD_PORT:-3100}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    networks:
      - isolated
      - edge
volumes:
  data:
networks:
  isolated:
    internal: true
  edge:

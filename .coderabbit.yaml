# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: chill
  auto_approvals:
    enabled: false
  high_level_summary_in_walkthrough: true
  poem: false
  auto_review:
    enabled: true
    drafts: true
  path_instructions:
    - path: "**"
      instructions: >-
        Prioritize reproducible correctness, security, and data-loss issues.
        Give the affected path, triggering scenario, impact, and a focused
        verification step. Check authentication and guest-library isolation,
        archive path handling, and persistence when affected by the change.
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false
chat:
  auto_reply: false
